<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tri Photos</title>
<link rel="icon" href="data:,">
<style>
:root{
  --nuit:#0e1318;--nuit2:#141b22;--carte:#1a232c;--carte2:#212c37;--ligne:#2a3642;--txt:#eef2f4;--doux:#9aa8b3;--faible:#66737e;
  --sapin:#3f9a6e;--sapin-c:#7fd3a6;--sapin-f:#13291f;--soleil:#f0894a;--soleil-c:#ffb27f;--soleil-f:#33200f;
  --rouge:#e0573f;--rouge-f:#35160f;--glacier:#8cc0e0;--glacier-f:#122333;
  --titre:"Bahnschrift","Barlow Condensed","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --texte:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--nuit);color:var(--txt);font:15px/1.5 var(--texte);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;cursor:pointer;background:var(--carte2);border:1px solid var(--ligne);border-radius:10px;padding:8px 14px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--doux)}
.btn.principal{background:var(--sapin);border-color:var(--sapin);color:#fff;font-weight:600}
.btn.principal:hover{background:#48aa7b}
.btn.soleil{background:var(--soleil);border-color:var(--soleil);color:#241205;font-weight:700}
.btn.grand{padding:12px 20px;font-size:16px;border-radius:12px}
.btn.discret{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:17px;height:17px;flex:none}
.lien{background:none;border:0;padding:0;color:var(--glacier);text-decoration:underline;cursor:pointer;font-size:14px}

/* En-tête : crêtes au coucher du soleil */
.ciel{position:relative;overflow:hidden;background:linear-gradient(180deg,#121c27 0%,#1b2733 45%,#2b2a33 78%,#3a2a29 100%);border-bottom:1px solid var(--ligne)}
.ciel svg.cretes{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;display:block}
.entete{position:relative;max-width:1240px;margin:auto;padding:34px clamp(16px,3vw,40px) 120px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:space-between}
.marque{display:flex;gap:14px;align-items:center}
.marque .logo{width:52px;height:52px;flex:none}
.marque h1{margin:0;font-family:var(--titre);font-weight:700;font-size:clamp(30px,4.6vw,46px);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.marque .devise{font-family:var(--titre);color:var(--soleil-c);letter-spacing:.18em;text-transform:uppercase;font-size:13px;margin-top:6px}
.etat-appli{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.puces{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.puce{font-size:12.5px;padding:4px 10px;border-radius:999px;background:rgba(14,19,24,.6);border:1px solid var(--ligne);color:var(--doux);backdrop-filter:blur(4px)}
.puce.ok{color:var(--sapin-c);border-color:#2b5a42} .puce.alerte{color:var(--soleil-c);border-color:#6a4220}
.raccourcis-haut{display:flex;gap:6px}
.raccourcis-haut .btn{background:rgba(14,19,24,.55);backdrop-filter:blur(4px);padding:6px 12px;font-size:14px}

main{max-width:1240px;margin:-64px auto 0;position:relative;padding:0 clamp(16px,3vw,40px) 60px}
.titre-section{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px}
.titre-section h2{margin:0;font-family:var(--titre);font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--doux)}
.titre-section .trait{flex:1;height:1px;background:var(--ligne)}
.titre-section .compte{font-size:13px;color:var(--faible)}
main > :first-child .titre-section, main > .zone:first-child .titre-section{margin-top:0}

.bloc{background:var(--nuit2);border:1px solid var(--ligne);border-radius:16px;padding:18px 20px}
.bloc h3{margin:0 0 4px;font-size:17px}
.note{color:var(--doux);font-size:13.5px;margin-top:8px}
.ligne{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.champ{flex:1;min-width:200px;background:var(--nuit);border:1px solid var(--ligne);border-radius:10px;padding:10px 12px}
.champ:focus{outline:2px solid var(--sapin);outline-offset:-1px}

/* Tâche en cours */
.tache{border-color:#2b5a42;background:linear-gradient(135deg,var(--sapin-f),var(--nuit2))}
.tache.erreur{border-color:var(--rouge);background:var(--rouge-f)}
.barre{height:8px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sapin),var(--sapin-c));transition:width .4s}
.barre.indet i{width:35%;animation:va 1.3s ease-in-out infinite}
@keyframes va{0%{margin-left:-35%}100%{margin-left:100%}}
.journal{background:var(--nuit);border:1px solid var(--ligne);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--doux);white-space:pre-wrap;max-height:140px;overflow:auto;margin:10px 0 0}

/* Carte SD : ticket */
.ticket{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(120deg,var(--soleil-f),var(--nuit2) 60%);border:1px solid #5b3a20;border-left:5px solid var(--soleil);border-radius:16px;padding:18px 20px}
.ticket .icone{width:54px;height:54px;border-radius:14px;background:rgba(240,137,74,.15);display:grid;place-items:center}
.ticket .icone svg{width:30px;height:30px}
.ticket h3{margin:0;font-family:var(--titre);font-size:20px;letter-spacing:.03em}
.ticket .compteur-sd{font-size:14px;color:var(--soleil-c);margin-top:2px}
@media (max-width:600px){.ticket{grid-template-columns:1fr}.ticket .icone{display:none}}

/* Nouvelle sortie */
.nouvelle{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border:1.5px dashed #3a4856;background:transparent}
.nouvelle .texte{max-width:560px}
.nouvelle h3{font-family:var(--titre);font-size:19px;letter-spacing:.02em}
.chemin{display:none;margin-top:12px;width:100%} .chemin.vu{display:flex}

/* Carnet de sorties */
.sorties{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.sortie{background:var(--nuit2);border:1px solid var(--ligne);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.sortie:hover{border-color:#3c4b59;transform:translateY(-2px)}
.sortie.vedette{grid-column:span 2}
.sortie .couv{display:block;position:relative;aspect-ratio:4/3;background:var(--carte) center/cover no-repeat;text-decoration:none}
.sortie.vedette .couv{aspect-ratio:16/8.4}
.sortie .couv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,19,24,0) 40%,rgba(14,19,24,.92) 100%)}
.sortie .couv .vide-couv{position:absolute;inset:0;display:grid;place-items:center;color:var(--faible)}
.sortie .badge{position:absolute;left:12px;top:12px;z-index:2;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(14,19,24,.75);border:1px solid rgba(255,255,255,.15)}
.sortie .badge.maj{background:var(--soleil);color:#241205;border-color:var(--soleil)}
.sortie .badge.ok{background:rgba(63,154,110,.9);border-color:transparent;color:#fff}
.sortie .titre{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.sortie .titre .date{font-family:var(--titre);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soleil-c)}
.sortie .titre h4{margin:2px 0 0;font-family:var(--titre);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sortie.vedette .titre h4{font-size:30px}
.sortie .corps{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.stats{display:flex;gap:14px;font-size:14px;font-variant-numeric:tabular-nums;align-items:center;flex-wrap:wrap}
.stats .v{color:var(--sapin-c);font-weight:600} .stats .r{color:#ff9a86} .stats .n{color:var(--faible);margin-left:auto;font-size:13px}
.repartition{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--carte)}
.repartition i{display:block;height:100%}
.sortie .pied{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.sortie .pied .btn{font-size:13px;padding:6px 11px;border-radius:9px}
.sortie .pied .btn.principal{padding:6px 14px}
.sortie.absente{opacity:.6}
details.plus{position:relative;margin-left:auto}
details.plus summary{list-style:none;font-size:16px;line-height:1;padding:6px 11px}
details.plus summary::-webkit-details-marker{display:none}
details.plus .menu{position:absolute;right:0;bottom:calc(100% + 6px);z-index:10;min-width:230px;background:var(--carte2);border:1px solid var(--ligne);border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
details.plus .menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
details.plus .menu button:hover{background:var(--carte)}
details.plus .menu small{display:block;color:var(--faible);font-size:12px}
.sortie .alerte-maj{font-size:13px;color:var(--soleil-c)}
.vide{color:var(--doux);text-align:center;padding:48px 20px;border:1.5px dashed var(--ligne);border-radius:16px}
.vide svg{width:64px;height:64px;opacity:.5;display:block;margin:0 auto 10px}
@media (max-width:700px){.sortie.vedette{grid-column:auto}.sortie.vedette .couv{aspect-ratio:4/3}.sortie.vedette .titre h4{font-size:22px}}
@media (max-width:600px){.sorties{grid-template-columns:1fr 1fr;gap:10px}.sortie .pied,.stats .n{display:none}.sortie .titre h4{font-size:16px}.sortie.vedette{grid-column:span 2}.entete{padding-bottom:100px}}

footer{margin-top:44px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--ligne);padding-top:18px;align-items:center}
footer .signature{color:var(--faible);font-size:12.5px;font-family:var(--titre);letter-spacing:.12em;text-transform:uppercase}
.tel{margin-top:12px;display:none} .tel.vu{display:block}
.tel code{display:block;background:var(--nuit);border:1px solid var(--ligne);border-radius:8px;padding:8px 10px;margin:6px 0;word-break:break-all;font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--nuit);padding:9px 16px;border-radius:999px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.vu{opacity:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-montagne" viewBox="0 0 24 24"><path d="M3 20 9.5 8l3.5 6 2-3 6 9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8 10.8 1.5-1.3 1.6 1.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-appareil" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.3" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-dossier" viewBox="0 0 24 24"><path d="M3 6.5h6l2 2h10V19H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-reglages" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>

  <symbol id="i-aide" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.7 9.6a2.4 2.4 0 1 1 3.4 2.2c-.8.4-1.1.9-1.1 1.7M12 16.6v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-quitter" viewBox="0 0 24 24"><path d="M12 4v8M7.5 6.8a7 7 0 1 0 9 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<div class="ciel">
  <div class="entete">
    <div class="marque">
      <svg class="logo" viewBox="0 0 52 52" aria-hidden="true">
        <rect width="52" height="52" rx="14" fill="#1a232c" stroke="#2a3642"/>
        <circle cx="35" cy="17" r="5.5" fill="#f0894a"/>
        <path d="M8 41 21 19l7 11 4-6 12 17z" fill="#eef2f4"/>
        <path d="m18.2 23.8 2.8-4.8 2.9 4.6-1.6-.9-1.3 1.3-1.2-1.2z" fill="#8cc0e0"/>
      </svg>
      <div>
        <h1>Tri Photos</h1>
        <div class="devise">Carnet de sorties · tri local et gratuit</div>
      </div>
    </div>
    <div class="etat-appli">
      <div class="puces" id="puces"></div>
      <div class="raccourcis-haut">
        <a class="btn" href="/reglages"><svg><use href="#i-reglages"/></svg>Réglages</a>
        <a class="btn" href="/diagnostic" title="En cas de problème"><svg><use href="#i-aide"/></svg>Diagnostic</a>
      </div>
    </div>
  </div>
  <svg class="cretes" viewBox="0 0 1440 150" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3a48"/><stop offset="1" stop-color="#1b2530"/></linearGradient>
      <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2832"/><stop offset="1" stop-color="#121a21"/></linearGradient>
    </defs>
    <circle cx="1130" cy="70" r="26" fill="#f0894a" opacity=".85"/>
    <path d="M0 96 120 58 210 84 330 30 420 70 520 46 640 88 760 40 860 76 980 22 1080 66 1180 50 1300 84 1440 44V150H0z" fill="url(#g1)"/>
    <path d="m330 30 18 14-10-2-12 9-10-8zM980 22l20 16-11-3-10 9-12-9zM760 40l15 12-9-2-9 7-8-6z" fill="#8a9fb2" opacity=".55"/>
    <path d="M0 122 150 92 260 116 380 80 500 112 620 94 740 124 880 86 1000 118 1120 96 1250 122 1440 90V150H0z" fill="url(#g2)"/>
    <path d="M0 150V138l180-20 160 24 190-26 200 22 220-18 240 20 250-16V150z" fill="#0e1318"/>
  </svg>
</div>

<main>
  <div id="zone-tache" class="zone"></div>
  <div id="zone-ia" class="zone"></div>
  <div id="zone-sd" class="zone"></div>

  <div class="zone" id="zone-nouvelle">
    <div class="titre-section"><h2>Nouvelle sortie</h2><span class="trait"></span></div>
    <div class="bloc nouvelle">
      <div class="texte">
        <h3>Un dossier de photos à trier ?</h3>
        <div class="note" style="margin-top:2px">RAW (NEF, CR3, ARW…) et/ou JPEG, d'un ou plusieurs appareils. Tes fichiers ne sont jamais modifiés. Tu peux aussi glisser un dossier sur l'icône du bureau.</div>
      </div>
      <div class="ligne">
        <button class="btn principal grand" id="b-ouvrir"><svg><use href="#i-dossier"/></svg>Choisir un dossier…</button>
        <button class="lien" id="b-chemin">ou coller un chemin</button>
      </div>
      <div class="ligne chemin" id="ligne-chemin">
        <input class="champ" id="chemin" placeholder="D:\Photos\2026-10-31 Pyrénées">
        <button class="btn" id="b-chemin-go">Trier ce dossier</button>
      </div>
    </div>
  </div>

  <div class="titre-section"><h2>Carnet de sorties</h2><span class="trait"></span><span class="compte" id="nb-sorties"></span></div>
  <div id="sorties"></div>

  <footer>
    <button class="btn" id="b-tel"><svg><use href="#i-tel"/></svg>Trier depuis le téléphone</button>
    <span style="flex:1"></span>
    <span class="signature" id="signature"></span>
    <button class="btn discret" id="b-quitter"><svg><use href="#i-quitter"/></svg>Quitter</button>
  </footer>
  <div class="bloc tel" id="tel"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = null, attenteSid = null, sdNoms = {}, minuteur = null;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('vu');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('vu'),3000);}
async function post(url, corps){
  const r = await fetch(url,{method:'POST',body:JSON.stringify(corps||{})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.erreur || 'Erreur');
  return j;
}
const fmtDate = t => new Date(t*1000).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).replace(/\./g,'');
const section = (titre, droite) => `<div class="titre-section"><h2>${titre}</h2><span class="trait"></span>${droite?`<span class="compte">${droite}</span>`:''}</div>`;

async function charger(){
  try{ D = await (await fetch('/api/accueil')).json(); }catch(e){ return planifier(5000); }
  rendre();
  planifier(D.tache.etat==='en cours' || D.installation_ia?.etat==='en cours' ? 1500 : 4000);
}
function planifier(ms){ clearTimeout(minuteur); minuteur = setTimeout(charger, ms); }

function rendre(){
  // État de l'appli
  const ia = D.ia;
  let puces = '';
  if(!ia.verifie) puces += '<span class="puce">IA : vérification…</span>';
  else if(ia.dispo) puces += `<span class="puce ok">● IA active · ${esc(ia.gpu ? ia.nom : 'processeur')}</span>`;
  else puces += '<span class="puce alerte">● IA non installée</span>';
  $('#puces').innerHTML = puces;
  $('#signature').textContent = `Tri Photos · ${D.version}`;
  if(D.sur_telephone){ $('#zone-nouvelle').style.display='none'; $('#b-quitter').style.display='none'; $('#b-tel').style.display='none'; }

  // Tâche
  const t = D.tache; let h = '';
  const occupe = t.etat==='en cours';
  if(t.etat==='en cours' || t.etat==='termine' || t.etat==='erreur'){
    const pc = t.total ? Math.round(100*t.fait/t.total) : 0;
    const titre = t.etat==='erreur' ? 'Problème' : t.etat==='termine' ? 'Prêt à trier' : (t.type==='import' ? 'Import de la carte' : 'Analyse en cours');
    h = section('En cours') + `<div class="bloc tache ${t.etat==='erreur'?'erreur':''}"><h3>${esc(titre)} — ${esc(t.nom||'')}</h3>`;
    if(t.etat==='en cours'){
      h += `<div class="note" style="color:var(--txt)">${esc(t.etape)} ${t.total?`· ${t.fait}/${t.total}`:''} ${esc(t.message||'')}</div>
        <div class="barre ${t.total?'':'indet'}"><i style="width:${pc}%"></i></div>
        <div class="note">Tu peux laisser tourner : l'analyse continue même si tu fermes cet onglet.</div>`;
    } else if(t.etat==='termine'){
      h += `<div class="note" style="color:var(--txt)">${esc(t.message)}</div>
        <div class="ligne" style="margin-top:12px"><a class="btn principal" href="/s/${t.sid}/">Ouvrir le tri →</a></div>`;
    } else {
      h += `<div class="note" style="color:var(--txt)">${esc(t.message)}</div>`;
    }
    h += '</div>';
    if(t.etat==='termine' && attenteSid===t.sid){ attenteSid=null; location.href=`/s/${t.sid}/`; }
  }
  $('#zone-tache').innerHTML = h;

  // IA
  const ins = D.installation_ia; let hi = '';
  if(!D.python_ok && !D.sur_telephone){
    hi = section('IA') + `<div class="bloc" style="border-color:#6a4220"><h3>Installation à réparer pour activer l'IA</h3>
      <div class="note" style="color:var(--txt);margin:0">Tri Photos tourne avec Python ${esc(D.python)}, trop récent pour l'IA. La réparation réinstalle l'appli avec Python 3.12 puis installe l'IA (10 à 20 min, avec internet). Tes sorties et tes choix sont gardés.</div>
      <div class="note">Une fenêtre bleue PowerShell va s'ouvrir et l'appli va se fermer pendant la réparation ; elle se rouvrira toute seule à la fin.</div>
      <div class="ligne" style="margin-top:12px"><button class="btn soleil" id="b-reparer" ${occupe?'disabled':''}>Réparer l'installation</button></div></div>`;
  } else if(ia.verifie && !ia.dispo && !D.sur_telephone){
    const enCours = ins && ins.etat==='en cours';
    hi = section('IA') + `<div class="bloc"><h3>${enCours?'Installation de l\'IA en cours…':'L\'IA n\'est pas installée'}</h3>`;
    if(enCours){
      hi += `<div class="barre indet"><i></i></div><pre class="journal">${esc(ins.lignes.join('\n'))}</pre>
        <div class="note">5 à 15 minutes selon la connexion. Tu peux continuer à trier pendant ce temps.</div>`;
    } else {
      hi += `<div class="note" style="color:var(--txt);margin:0">Elle juge l'esthétique et repère les scènes qui se ressemblent, pour une sélection plus juste et plus variée. Il faut internet pour l'installer (une seule fois, environ 1 à 3 Go).</div>`;
      if(ins && (ins.etat==='echec' || ins.etat==='interrompue'))
        hi += `<pre class="journal">${esc(ins.lignes.join('\n'))}</pre><div class="note">La dernière tentative a échoué. Envoie le journal à Claude : <button class="lien" id="b-journal">ouvrir le journal</button></div>`;
      hi += `<div class="ligne" style="margin-top:12px"><button class="btn principal" id="b-ia" ${occupe?'disabled':''}>Installer l'IA</button></div>`;
    }
    hi += '</div>';
  }
  $('#zone-ia').innerHTML = hi;
  if($('#b-ia')) $('#b-ia').onclick = async()=>{ try{ await post('/api/installer_ia'); charger(); }catch(e){ toast(e.message); } };
  if($('#b-journal')) $('#b-journal').onclick = ()=>post('/api/ouvrir_journal_ia');
  if($('#b-reparer')) $('#b-reparer').onclick = async()=>{
    if(!confirm('Lancer la réparation ? L\'appli va se fermer pendant 10 à 20 minutes.')) return;
    try{ await post('/api/reparer'); toast('Réparation lancée dans la fenêtre PowerShell'); }catch(e){ toast(e.message); } };

  // Cartes SD (on garde ce que l'utilisateur a tapé dans le champ nom)
  document.querySelectorAll('[data-nom-sd]').forEach(i=>sdNoms[i.dataset.nomSd]=i.value);
  let sd = '';
  for(const c of D.cartes){
    const nom = sdNoms[c.racine] ?? c.nom_propose;
    sd += section('Carte détectée') + `<div class="ticket"><div class="icone"><svg style="color:var(--soleil)"><use href="#i-appareil"/></svg></div><div>
      <h3>${esc(c.nom)}</h3>`;
    if(c.n_nouvelles){
      sd += `<div class="compteur-sd">${c.n_nouvelles} nouvelle${c.n_nouvelles>1?'s':''} photo${c.n_nouvelles>1?'s':''} · ${String(c.taille_go).replace('.',',')} Go${c.n_photos>c.n_nouvelles?` · ${c.n_photos-c.n_nouvelles} déjà importées`:''}</div>
        <div class="ligne" style="margin-top:12px"><input class="champ" data-nom-sd="${esc(c.racine)}" value="${esc(nom)}" aria-label="Nom de la sortie" title="Nom de la sortie">
        <button class="btn soleil" data-importer="${esc(c.racine)}" ${occupe?'disabled':''}>Importer et trier</button></div>
        <div class="note">Copie dans ${esc(D.dossier_import)}\\${esc(nom)}. Rien n'est effacé de la carte.</div>`;
    } else sd += `<div class="note" style="margin-top:2px">Les ${c.n_photos} photos de la carte ont déjà été importées.</div>`;
    sd += '</div></div>';
  }
  if(document.activeElement?.dataset?.nomSd === undefined) $('#zone-sd').innerHTML = sd;
  $('#b-ouvrir').disabled = occupe; $('#b-chemin-go').disabled = occupe;

  // Carnet de sorties
  $('#nb-sorties').textContent = D.sorties.length ? `${D.sorties.length} sortie${D.sorties.length>1?'s':''}` : '';
  if(!D.sorties.length){
    $('#sorties').innerHTML = '<div class="vide"><svg><use href="#i-montagne"/></svg>Ton carnet est vide pour l\'instant.<br>Insère ta carte SD ou choisis un dossier de photos.</div>';
    return;
  }
  $('#sorties').innerHTML = '<div class="sorties">' + D.sorties.map((s, i) => {
    const vedette = i === 0 && D.sorties.length > 2 ? ' vedette' : '';
    if(!s.present) return `<div class="sortie absente"><div class="corps"><h4 style="margin:0;font-family:var(--titre);text-transform:uppercase">${esc(s.nom)}</h4>
      <div class="note" style="margin:0">Dossier introuvable (disque débranché ?)<br>${esc(s.dossier)}</div>
      <div class="pied"><button class="btn" data-retirer="${s.sid}">Retirer de la liste</button></div></div></div>`;
    const c = s.compte || {}, tot = (c.meilleure||0)+(c.garder||0)+(c.supprimer||0) || 1;
    const couv = s.couverture ? `background-image:url('/s/${s.sid}/mini/${encodeURIComponent(s.couverture)}.jpg')` : '';
    const nomCourt = s.nom.replace(/^\d{4}[-_.]\d{2}[-_.]\d{2}[\s_-]*/, '') || s.nom;  // la date est déjà affichée au-dessus
    const titre = `<div class="titre"><div class="date">${fmtDate(s.date)}</div><h4 title="${esc(s.nom)}">${esc(nomCourt)}</h4></div>`;
    if(!s.a_jour) return `<div class="sortie${vedette}"><a class="couv" href="#" data-maj="${s.sid}" style="${couv}"><span class="badge maj">À mettre à jour</span>${titre}</a>
      <div class="corps"><div class="alerte-maj">Nouvelle version de l'analyse : flou mieux détecté, photos couchées redressées. Tes choix faits à la main sont gardés.</div>
      <div class="pied"><button class="btn soleil" data-maj="${s.sid}" ${occupe?'disabled':''}>Mettre à jour</button>
        <button class="btn" data-retirer="${s.sid}">Retirer</button></div></div></div>`;
    return `<div class="sortie${vedette}"><a class="couv" href="/s/${s.sid}/" style="${couv}">${s.exporte?'<span class="badge ok">Exportée</span>':''}${titre}</a>
      <div class="corps">
        <div class="stats"><span class="v">★ ${c.meilleure||0}</span><span>✓ ${c.garder||0}</span><span class="r">✕ ${c.supprimer||0}</span><span class="n">${s.n_photos} photos</span></div>
        <div class="repartition" title="Meilleures / à garder / à supprimer"><i style="width:${100*(c.meilleure||0)/tot}%;background:var(--sapin)"></i><i style="width:${100*(c.garder||0)/tot}%;background:#4a5a68"></i><i style="width:${100*(c.supprimer||0)/tot}%;background:var(--rouge)"></i></div>
        <div class="pied"><a class="btn principal" href="/s/${s.sid}/">Trier</a>
          <button class="btn" data-dossier="${s.sid}" title="Ouvrir le dossier des photos"><svg><use href="#i-dossier"/></svg>Dossier</button>
          <details class="plus"><summary class="btn" title="Plus d'actions">⋯</summary><div class="menu">
            <button data-reanalyser="${s.sid}" ${occupe?'disabled':''}>Réanalyser <small>tes choix faits à la main sont gardés</small></button>
            <button data-retirer="${s.sid}">Retirer du carnet <small>les photos ne sont pas touchées</small></button>
          </div></details></div>
      </div></div>`;
  }).join('') + '</div>';
}

async function ouvrir(chemin){
  try{
    const r = await post('/api/ouvrir', {chemin});
    if(r.annule) return;
    if(r.deja){ location.href = `/s/${r.sid}/`; return; }
    attenteSid = r.sid; charger();
  }catch(e){ toast(e.message); }
}
$('#b-ouvrir').onclick = () => ouvrir('');
$('#b-chemin').onclick = () => { $('#ligne-chemin').classList.toggle('vu'); $('#chemin').focus(); };
$('#b-chemin-go').onclick = () => { const c=$('#chemin').value.trim(); if(c) ouvrir(c); };
$('#chemin').onkeydown = e => { if(e.key==='Enter') $('#b-chemin-go').click(); };

document.addEventListener('click', async e => {
  const b = e.target.closest('button,[data-maj]'); if(!b) return;
  if(b.tagName==='A') e.preventDefault();
  b.closest('details')?.removeAttribute('open');
  try{
    if(b.dataset.maj){
      const r = await post('/api/reanalyser', {sid:b.dataset.maj}); attenteSid = r.sid; charger();
    } else if(b.dataset.importer){
      const nom = document.querySelector(`[data-nom-sd="${CSS.escape(b.dataset.importer)}"]`)?.value || '';
      const r = await post('/api/importer', {racine:b.dataset.importer, nom}); attenteSid = r.sid; delete sdNoms[b.dataset.importer]; charger();
    } else if(b.dataset.reanalyser){
      if(!confirm('Refaire l\'analyse avec les réglages actuels ? Tes choix faits à la main sont gardés.')) return;
      const r = await post('/api/reanalyser', {sid:b.dataset.reanalyser}); attenteSid = r.sid; charger();
    } else if(b.dataset.retirer){
      if(!confirm('Retirer cette sortie du carnet ? Les photos ne sont pas touchées.')) return;
      await post('/api/retirer', {sid:b.dataset.retirer}); charger();
    } else if(b.dataset.dossier){
      await post('/api/ouvrir_dossier_sortie', {sid:b.dataset.dossier});
    }
  }catch(err){ toast(err.message); }
});

$('#b-tel').onclick = async () => {
  try{
    const r = await post('/api/telephone');
    const el = $('#tel'); el.classList.add('vu');
    el.innerHTML = r.urls.length
      ? `<b>Sur ton téléphone</b>, connecté au même Wi-Fi (ou au partage de connexion de ce PC), ouvre :${r.urls.map(u=>`<code>${esc(u)}</code>`).join('')}
         <div class="note">Si Windows demande l'autorisation du pare-feu, accepte pour les réseaux privés. Le lien contient une clé : ne le partage pas.</div>`
      : '<b>Aucun réseau détecté.</b> Connecte ce PC au Wi-Fi ou au partage de connexion du téléphone, puis réessaie.';
    el.scrollIntoView({behavior:'smooth'});
  }catch(e){ toast(e.message); }
};
$('#b-quitter').onclick = async () => {
  if(D?.tache?.etat==='en cours' && !confirm('Une tâche est en cours. Quitter quand même ?')) return;
  await post('/api/quitter').catch(()=>{});
  clearTimeout(minuteur);
  document.body.innerHTML = '<main style="margin-top:60px"><h1 style="font-family:var(--titre);text-transform:uppercase;letter-spacing:.06em">Tri Photos est fermé</h1><p class="note">Tes décisions sont enregistrées. Relance l\'appli avec l\'icône du bureau.</p></main>';
};
charger();
</script>
</body>
</html>
