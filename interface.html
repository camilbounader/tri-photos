<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tri Photos</title>
<link rel="icon" href="data:,">
<style>
:root{
  --fond:#111110;--fond2:#1a1a18;--carte:#22211f;--ligne:#33322e;--txt:#f1efe9;--doux:#a19e94;--faible:#6f6c64;
  --vert:#3fae6a;--vert-f:#173a26;--rouge:#e0573f;--rouge-f:#3d1a14;--ambre:#e2a93b;--ambre-f:#3a2c10;--bleu:#6aa3e8;
  --rayon:12px;--hauteur:220px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.btn{text-decoration:none;display:inline-block;background:var(--carte);border:1px solid var(--ligne);border-radius:999px;padding:7px 14px;white-space:nowrap}
.btn:hover{border-color:var(--doux)} .btn.on{background:var(--txt);color:var(--fond);border-color:var(--txt)}
.btn.principal{background:var(--vert);border-color:var(--vert);color:#fff;font-weight:600}
.btn.danger{border-color:var(--rouge);color:var(--rouge)}
.n{opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}

/* En-tête */
header{padding:22px clamp(16px,3vw,40px) 10px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(22px,3vw,30px);letter-spacing:-.01em}
.sous{color:var(--doux);margin-top:4px;font-size:14px}
.compteurs{display:flex;gap:8px;flex-wrap:wrap}
.compteur{background:var(--fond2);border:1px solid var(--ligne);border-radius:10px;padding:8px 12px;min-width:92px}
.compteur b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.compteur span{font-size:12px;color:var(--doux)}
.compteur.v b{color:var(--vert)} .compteur.r b{color:var(--rouge)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Barre d'outils */
nav{position:sticky;top:0;z-index:20;background:rgba(17,17,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ligne);
  padding:10px clamp(16px,3vw,40px);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav .sep{flex:1}
nav label{display:flex;align-items:center;gap:8px;color:var(--doux);font-size:14px}
nav input[type=range]{width:110px;accent-color:var(--txt)}

/* Moments */
main{padding:0 clamp(16px,3vw,40px) 80px}
.moment{margin-top:34px}
.titre-moment{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--ligne)}
.titre-moment h2{margin:0;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.01em}
.titre-moment .quand{color:var(--doux);font-size:15px}
.titre-moment .info{color:var(--faible);font-size:13px}
.vide{color:var(--doux);padding:60px 0;text-align:center}

/* Grille justifiée */
.grille{display:flex;flex-wrap:wrap;gap:8px}
.grille::after{content:"";flex-grow:999999}
.photo{position:relative;border-radius:8px;overflow:hidden;background:var(--fond2);cursor:pointer;outline:3px solid transparent;outline-offset:-3px}
.photo i{display:block}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .25s,opacity .2s}
.photo:hover img{transform:scale(1.02)}
.photo.d-meilleure{outline-color:var(--vert)}
.photo.d-supprimer{outline-color:var(--rouge)}
.photo.d-supprimer img{opacity:.38}
.photo .etat{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
.pastille{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;backdrop-filter:blur(4px)}
.pastille.v{background:var(--vert)} .pastille.r{background:var(--rouge)} .pastille.a{background:rgba(226,169,59,.92);color:#1b1407}
.photo .serie{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.25)}
.photo .serie:hover{background:#000}
.photo .rapide{position:absolute;right:8px;top:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.photo:hover .rapide{opacity:1}
.rapide button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:15px}
.rapide button:hover{background:#000}
.photo.membre{box-shadow:0 0 0 2px var(--bleu) inset}
@media (hover:none){.photo .rapide{display:none}}
@media (max-width:600px){
  :root{--hauteur:100px}
  nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 16px}
  nav::-webkit-scrollbar{display:none}
  nav .sep,nav label.taille{display:none}
  header{padding-top:16px} .compteur{min-width:0;flex:1} .compteurs{width:100%}
  .grille{gap:5px} .pastille{font-size:11px;padding:2px 6px}
}

/* Diaporama */
#diapo{position:fixed;inset:0;z-index:50;background:#000;display:none;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr)}
#diapo.ouvert{display:grid}
.d-haut{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0b0b0a;border-bottom:1px solid #222}
.d-haut .nom{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0} .d-haut .pos{color:var(--doux);font-variant-numeric:tabular-nums;white-space:nowrap}
.d-haut .sep{flex:1}
.scene{position:relative;overflow:hidden;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.scene img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.scene.zoom{overflow:auto;display:block;cursor:zoom-out}
.scene.zoom img{max-width:none;max-height:none}
.scene .chargement{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--doux);background:rgba(0,0,0,.6);padding:4px 10px;border-radius:999px}
.fleche{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:26px;z-index:2}
.fleche:hover{background:rgba(0,0,0,.8)} .fleche.g{left:14px} .fleche.d{right:14px}
.badge-retouche{position:absolute;top:14px;left:14px;background:var(--ambre);color:#1b1407;font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;display:none;z-index:2}
.panneau{background:var(--fond2);border-left:1px solid #222;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.bandeau{border-radius:var(--rayon);padding:12px 14px;border:1px solid}
.bandeau h3{margin:0 0 6px;font-size:15px}
.bandeau ul{margin:0;padding-left:18px;color:var(--txt);font-size:14px}
.bandeau.v{background:var(--vert-f);border-color:var(--vert)} .bandeau.v h3{color:#7fd8a1}
.bandeau.r{background:var(--rouge-f);border-color:var(--rouge)} .bandeau.r h3{color:#ff9a86}
.bandeau.a{background:var(--ambre-f);border-color:var(--ambre)} .bandeau.a h3{color:#f3c86e}
.bandeau.n{background:var(--carte);border-color:var(--ligne)} .bandeau.n h3{color:var(--doux)}
.lien{color:var(--bleu);background:none;border:0;padding:0;text-decoration:underline}
.decisions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.decisions button{border:1px solid var(--ligne);background:var(--carte);border-radius:10px;padding:10px 4px;font-size:13px;line-height:1.2}
.decisions button b{display:block;font-size:18px;margin-bottom:2px}
.decisions button kbd{display:block;font-size:11px;color:var(--faible);margin-top:3px;font-family:inherit}
.decisions .on.meilleure{background:var(--vert);border-color:var(--vert);color:#fff}
.decisions .on.garder{background:var(--txt);border-color:var(--txt);color:var(--fond)}
.decisions .on.supprimer{background:var(--rouge);border-color:var(--rouge);color:#fff}
.decisions .on kbd{color:inherit;opacity:.75}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
dt{color:var(--doux)} dd{margin:0;font-variant-numeric:tabular-nums}
.raccourcis{font-size:12px;color:var(--faible);line-height:1.7}
kbd.k{border:1px solid var(--ligne);border-radius:4px;padding:0 5px;font-family:inherit;color:var(--doux)}
@media (max-width:860px){
  #diapo{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  #d-zoom{display:none} .d-haut{gap:8px;padding:8px 10px} .d-haut .btn{padding:6px 11px}
  .panneau{border-left:0;border-top:1px solid #222;max-height:42vh;padding:12px}
  .fleche{display:none} .raccourcis{display:none}
}

/* Fenêtre d'export */
.voile{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.voile.ouvert{display:flex}
.fenetre{background:var(--fond2);border:1px solid var(--ligne);border-radius:16px;max-width:560px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.fenetre h2{margin:0 0 12px}
.fenetre p{color:var(--doux);margin:8px 0}
.ligne-export{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ligne)}
.barre{height:8px;background:var(--carte);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.barre i{display:block;height:100%;width:0;background:var(--vert);transition:width .3s}
.fenetre .actions{margin-top:16px;justify-content:flex-end}
/* Sélection multiple */
.photo .coche{position:absolute;left:8px;bottom:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
body.mode-sel .photo .coche{display:flex}
body.mode-sel .photo .rapide{display:none}
.photo.choisie{outline-color:var(--bleu)!important}
.photo.choisie .coche{background:var(--bleu);border-color:var(--bleu)}
.photo.choisie img{opacity:.85}
.tout-moment{display:none;margin-left:auto}
body.mode-sel .tout-moment{display:inline-flex}
#barre-sel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:var(--fond2);border:1px solid var(--ligne);border-radius:16px;padding:10px 12px;display:none;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 40px rgba(0,0,0,.6);max-width:calc(100vw - 24px)}
body.mode-sel #barre-sel{display:flex}
#barre-sel b{font-variant-numeric:tabular-nums;padding:0 6px}
body.mode-sel main{padding-bottom:110px}
.btn.bleu{background:var(--bleu);border-color:var(--bleu);color:#0b1a2b;font-weight:600}
/* Outil Récupérer */
.recup label{display:block;font-size:14px;margin-top:10px}
.recup .lig{display:flex;justify-content:space-between;color:var(--doux);font-size:13px}
.recup .lig b{color:var(--txt);font-variant-numeric:tabular-nums}
.recup input[type=range]{width:100%;accent-color:var(--ambre)}
.recup .boutons{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.recup .boutons .btn{padding:7px 12px}
.verdict{font-size:14px;margin-top:6px}
#cadre{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;z-index:3;touch-action:none}
#cadre .tiers{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.45) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.45) 66.6%,transparent 66.8%),
  linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.45) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.45) 66.6%,transparent 66.8%)}
#cadre b{position:absolute;width:18px;height:18px;background:#fff;border-radius:3px}
#cadre b[data-p=nw]{left:-9px;top:-9px;cursor:nwse-resize} #cadre b[data-p=ne]{right:-9px;top:-9px;cursor:nesw-resize}
#cadre b[data-p=sw]{left:-9px;bottom:-9px;cursor:nesw-resize} #cadre b[data-p=se]{right:-9px;bottom:-9px;cursor:nwse-resize}
#cadre b[data-p=n],#cadre b[data-p=s]{left:calc(50% - 12px);width:24px;height:8px;cursor:ns-resize} #cadre b[data-p=n]{top:-5px} #cadre b[data-p=s]{bottom:-5px}
#cadre b[data-p=w],#cadre b[data-p=e]{top:calc(50% - 12px);width:8px;height:24px;cursor:ew-resize} #cadre b[data-p=w]{left:-5px} #cadre b[data-p=e]{right:-5px}
.recup .ligne-titre{display:flex;align-items:baseline;justify-content:space-between} .recup h3{margin:0;font-size:18px}
.recup .note-raw{font-size:12px;color:var(--doux)}
.recup h4.groupe{margin:18px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);border-top:1px solid var(--ligne);padding-top:12px}
.recup label{margin-top:8px}
.recup .aide{font-size:12px;color:var(--doux);margin:8px 0 0}
.ratios{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px} .ratios .btn{padding:4px 10px;font-size:13px}
.similaires .lig{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--doux);margin-bottom:6px} .similaires .lig b{color:var(--txt)}
.similaires .bande{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.vign{flex:0 0 auto;position:relative;width:74px;height:56px;padding:0;border:2px solid var(--ligne);border-radius:6px;overflow:hidden;background:var(--fond)}
.vign img{width:100%;height:100%;object-fit:cover;display:block}
.vign.d-meilleure{border-color:var(--vert)} .vign.d-supprimer{border-color:var(--rouge)} .vign.d-supprimer img{opacity:.45}
.vign.actuelle{outline:2px solid #fff;outline-offset:1px}
.vign span{position:absolute;right:3px;top:1px;font-size:12px;color:#fff;text-shadow:0 0 3px #000}
.btn.ambre{background:var(--ambre);border-color:var(--ambre);color:#1b1407;font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--fond);padding:9px 16px;border-radius:999px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.vu{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="titre">Tri Photos</h1>
    <div class="sous" id="sous"></div>
  </div>
  <div class="compteurs">
    <div class="compteur v"><b id="c-meilleure">0</b><span>★ meilleures</span></div>
    <div class="compteur"><b id="c-garder">0</b><span>à garder</span></div>
    <div class="compteur r"><b id="c-supprimer">0</b><span>à supprimer</span></div>
  </div>
  <div class="actions">
    <button class="btn principal" id="b-export">Exporter…</button>
    <a class="btn" href="/" id="b-accueil">← Accueil</a>
  </div>
</header>

<nav>
  <button class="btn on" data-filtre="tout">Tout<span class="n" id="f-tout"></span></button>
  <button class="btn" data-filtre="meilleure">★ Meilleures<span class="n" id="f-meilleure"></span></button>
  <button class="btn" data-filtre="garder">À garder<span class="n" id="f-garder"></span></button>
  <button class="btn" data-filtre="supprimer">À supprimer<span class="n" id="f-supprimer"></span></button>
  <button class="btn" data-filtre="doublon">Doublons<span class="n" id="f-doublon"></span></button>
  <span class="sep"></span>
  <button class="btn" id="b-sel">☐ Sélectionner</button>
  <label><input type="checkbox" id="replier" checked> Une seule photo par série</label>
  <label class="taille">Taille <input type="range" id="taille" min="120" max="420" step="10" value="220"></label>
  <button class="btn" id="b-plus">Actions ▾</button>
</nav>

<main id="contenu"></main>

<!-- Diaporama -->
<div id="diapo" aria-modal="true" role="dialog">
  <div class="d-haut">
    <button class="btn" id="d-fermer">✕ Fermer</button>
    <span class="nom" id="d-nom"></span><span class="pos" id="d-pos"></span>
    <span class="sep"></span>
    <button class="btn" id="d-gauche" title="Pivoter vers la gauche">⟲</button>
    <button class="btn" id="d-droite" title="Pivoter vers la droite (P)">⟳</button>
    <button class="btn ambre" id="d-recup" title="Retoucher : lumière, couleurs, rognage… (E)">Retoucher…</button>
    <button class="btn" id="d-retouche" title="Comparer avec la retouche automatique (R)">Retouche auto</button>
    <button class="btn" id="d-zoom" title="Taille réelle (Z ou double-clic)">Zoom 100 %</button>
  </div>
  <div class="scene" id="scene">
    <span class="badge-retouche" id="d-badge">Retouche automatique</span>
    <button class="fleche g" id="d-prec" aria-label="Précédente">‹</button>
    <img id="d-img" alt="">
    <button class="fleche d" id="d-suiv" aria-label="Suivante">›</button>
    <span class="chargement" id="d-charge" hidden>Chargement en pleine qualité…</span>
    <div id="cadre" hidden><i class="tiers"></i><b data-p="nw"></b><b data-p="ne"></b><b data-p="sw"></b><b data-p="se"></b><b data-p="n"></b><b data-p="s"></b><b data-p="w"></b><b data-p="e"></b></div>
  </div>
  <aside class="panneau" id="panneau"></aside>
</div>

<!-- Export -->
<div class="voile" id="v-export"><div class="fenetre" id="f-export"></div></div>
<!-- Actions groupées -->
<div class="voile" id="v-plus"><div class="fenetre">
  <h2>Actions groupées</h2>
  <p>Pour aller plus vite sur une grosse sortie.</p>
  <div class="actions" style="flex-direction:column;align-items:stretch">
    <button class="btn" id="a-doublons">Marquer tous les doublons « à supprimer »</button>
    <button class="btn" id="a-suggestions">Revenir aux suggestions de l'outil</button>
    <button class="btn" id="a-dossier">Ouvrir le dossier _TRI</button>
    <button class="btn" id="a-fermer">Fermer</button>
  </div>
</div></div>
<div id="barre-sel">
  <b id="n-sel">0 sélectionnée</b>
  <button class="btn" data-sel-dec="meilleure">★ Meilleure</button>
  <button class="btn" data-sel-dec="garder">✓ Garder</button>
  <button class="btn" data-sel-dec="supprimer">✕ Supprimer</button>
  <button class="btn" id="b-sel-pivoter" title="Pivoter les photos sélectionnées vers la droite">⟳ Pivoter</button>
  <button class="btn bleu" id="b-envoi">Envoyer sur Google Photos…</button>
  <button class="btn" id="b-sel-aucune">Tout désélectionner</button>
  <button class="btn" id="b-sel-fin">Terminer</button>
</div>
<div class="voile" id="v-envoi"><div class="fenetre" id="f-envoi"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const B = location.pathname.replace(/\/+$/,'');
let A, D, PH = {}, filtre = 'tout', replie = true, liste = [], idx = -1, retouche = false, seriesOuvertes = new Set();
let RECUP = {}, ver = {}, modeSel = false, sel = new Set(), dernierClic = null, modeRecup = false;
const vq = id => `?r=${PH[id]?.rotation||0}&v=${ver[id]||0}`;
const NOMS = {meilleure:'★ Meilleure', garder:'À garder', supprimer:'À supprimer'};
const jours = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const fmtH = t => new Date(t*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const fmtJ = t => {const d=new Date(t*1000);return `${jours[d.getDay()]} ${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}`};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('vu');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('vu'),1600);}

async function charger(){
  const r = await (await fetch(B+'/donnees')).json();
  A = r.analyse; D = r.decisions; A.photos.forEach(p => PH[p.id] = p); RECUP = r.recup || {};
  A._envoi = r.envoi; A._deplacees = r.deplacees;
  $('#titre').textContent = A.nom;
  const ia = {aucune:'sans IA (critères techniques)', clip:'IA : variété', 'clip+esthetique':'IA : note esthétique + variété'}[A.mode_ia];
  const reg = r.reglages_infos.modifie_le ? `réglages du ${r.reglages_infos.modifie_le}` : 'réglages par défaut';
  $('#sous').textContent = `${A.photos.length} photos · ${A.moments.length} moments · ${A.series.length} séries · ${ia} · ${reg}`;
  rendre();
}

function decisionParDefaut(p){return p.suggestion==='meilleure'?'meilleure':p.suggestion==='rejet'?'supprimer':'garder';}

function passeFiltre(p){
  if(filtre==='tout') return true;
  if(filtre==='doublon') return p.suggestion==='doublon';
  return D[p.id]===filtre;
}

function compter(){
  const c={meilleure:0,garder:0,supprimer:0};
  A.photos.forEach(p=>c[D[p.id]]++);
  for(const k in c){$('#c-'+k).textContent=c[k];$('#f-'+k).textContent=c[k];}
  $('#f-tout').textContent=A.photos.length;
  $('#f-doublon').textContent=A.photos.filter(p=>p.suggestion==='doublon').length;
}

function carte(p, serieN, estMembre){
  const r = p.largeur/p.hauteur, h = `var(--hauteur)`;
  const d = D[p.id];
  let past = '';
  if(d==='meilleure') past += '<span class="pastille v">★ Meilleure</span>';
  if(d==='supprimer') past += `<span class="pastille r">✕ ${esc(p.rejets?.[0] || 'À supprimer')}</span>`;
  if(d!=='supprimer' && p.suggestion==='rejet') past += `<span class="pastille r">${esc(p.rejets[0])}</span>`;
  if(p.suggestion==='doublon' && d!=='supprimer') past += '<span class="pastille a">Doublon</span>';
  else if(p.proche_de && p.suggestion==='garder' && d==='garder') past += '<span class="pastille">Proche d\'une ★</span>';
  if(RECUP[p.id]) past += '<span class="pastille a">Retouchée</span>';
  else if(p.badges?.some(b=>b.includes('rattrapable'))) past += '<span class="pastille">Rattrapable</span>';
  const serie = serieN>1 ? `<button class="serie" data-serie="${p.serie}">${seriesOuvertes.has(p.serie)?'Replier':'+'+(serieN-1)+' similaires'}</button>` : '';
  return `<div class="photo d-${d}${estMembre?' membre':''}${sel.has(p.id)?' choisie':''}" data-id="${esc(p.id)}" style="flex:${r} 1 calc(${r} * ${h});">
    <i style="padding-bottom:${(100/r).toFixed(3)}%"></i>
    <img loading="lazy" src="${B}/mini/${encodeURIComponent(p.id)}.jpg${vq(p.id)}" alt="">
    <span class="coche">${sel.has(p.id)?'✓':''}</span>
    <div class="etat">${past}</div>
    <div class="rapide">
      <button data-act="meilleure" title="Meilleure (S)">★</button>
      <button data-act="garder" title="Garder (G)">✓</button>
      <button data-act="supprimer" title="Supprimer (X)">✕</button>
      <button data-act="pivoter" title="Pivoter vers la droite">⟳</button>
    </div>${serie}</div>`;
}

function rendre(){
  compter();
  liste = [];
  const parSerie = {};
  A.series.forEach((s,i)=>parSerie[i]=s);
  let html = '';
  A.moments.forEach((ids, m) => {
    const ph = ids.map(i=>PH[i]);
    let cartes = '';
    const vues = new Set();
    for(const p of ph){
      const s = parSerie[p.serie];
      const tete = s.map(i=>PH[i]).find(x=>x.meilleure_serie) || PH[s[0]];
      const ouverte = seriesOuvertes.has(p.serie);
      if(replie && filtre==='tout' && !ouverte && s.length>1){
        // une seule vignette par série : la meilleure (ou la première si toute la série est rejetée)
        if(p.id!==tete.id || vues.has(p.serie)) continue;
        vues.add(p.serie);
        cartes += carte(p, s.length, false); liste.push(p.id);
        continue;
      }
      if(!passeFiltre(p)) continue;
      cartes += carte(p, (p.id===tete.id)?s.length:0, ouverte && s.length>1);
      liste.push(p.id);
    }
    if(!cartes) return;
    const nM = ph.filter(p=>D[p.id]==='meilleure').length;
    html += `<section class="moment"><div class="titre-moment"><h2>Moment ${m+1}</h2>
      <span class="quand">${fmtJ(ph[0].date)} · ${fmtH(ph[0].date)} → ${fmtH(ph[ph.length-1].date)}</span>
      <span class="info">${ph.length} photos · ${nM} ★</span><button class="btn tout-moment" data-moment="${m}">Tout sélectionner</button></div><div class="grille">${cartes}</div></section>`;
  });
  $('#contenu').innerHTML = html || '<div class="vide">Aucune photo dans ce filtre.</div>';
}

async function decider(ids, statut, silencieux){
  ids = [].concat(ids);
  ids.forEach(i=>D[i]=statut);
  await fetch(B+'/decision',{method:'POST',body:JSON.stringify({ids, statut})});
  if(!silencieux) toast(`${ids.length>1?ids.length+' photos':'Photo'} → ${NOMS[statut]}`);
}

      ${RI.enregistres ? '<button class="btn" id="r-effacer">Retirer mes retouches</button>' : ''}
    </div>
    <div id="r-etat-copie" class="aide">${RI.copie && RI.copie.etat==='termine' ? 'Copie JPEG déjà enregistrée. <button class="lien" id="r-dossier">Ouvrir le dossier</button>' : ''}</div>
    <p class="aide">Le RAW original n'est jamais modifié. Tes retouches servent aussi à l'export et à l'envoi « JPEG retouchés ». <kbd class="k">Échap</kbd> pour fermer.</p>
  </div>`;
  document.querySelectorAll('[data-r]').forEach(inp => {
    inp.oninput = () => { const k = inp.dataset.r; RR[k] = Number(inp.value); $('#rv-'+k).textContent = fmtN(k, RR[k]); rendreRecup(); };
    inp.closest('label').ondblclick = () => { const k = inp.dataset.r; RR[k] = RI.defaut[k]; inp.value = RR[k]; $('#rv-'+k).textContent = fmtN(k, RR[k]); rendreRecup(); };
  });
  const preset = r => { const crop = RR.crop, an = RR.an; RR = Object.assign({}, r, {crop, an}); panneauRecup(); rendreRecup(); };
  $('#r-auto').onclick = () => preset(RI.auto);
  $('#r-recup').onclick = () => preset(RI.recuperation);
  $('#r-neutre').onclick = () => preset(RI.defaut);
  $('#r-zones').onchange = e => { rZones = e.target.checked; rendreRecup(); };
  $('#r-rogner').onclick = () => { modeRogner ? validerRognage() : demarrerRognage(); };
  if($('#r-sans-crop')) $('#r-sans-crop').onclick = () => { RR.crop = null; panneauRecup(); rendreRecup(); };
  document.querySelectorAll('[data-ratio]').forEach(b => b.onclick = () => { appliquerRatio(RATIOS[+b.dataset.ratio][1]); panneauRecup(); placerCadre(); });
  $('#r-avant').onclick = () => { rOriginal = !rOriginal; panneauRecup(); rendreRecup(); };
  $('#r-annuler').onclick = fermerRecup;
  $('#r-garder').onclick = async () => { await sauverRetouche(id); toast('Retouche enregistrée'); fermerRecup(); };
  $('#r-copie').onclick = async () => {
    await sauverRetouche(id, true);
    $('#r-etat-copie').textContent = 'Création de la copie JPEG en pleine résolution…';
    const fin = Date.now() + 120000;
    while(Date.now() < fin){
      await new Promise(r => setTimeout(r, 1000));
      const e = await (await fetch(`${B}/copie/${encodeURIComponent(id)}`)).json();
      if(e.etat === 'termine'){ if($('#r-etat-copie')) $('#r-etat-copie').innerHTML = `Copie enregistrée : ${esc(e.chemin)} <button class="lien" id="r-dossier">Ouvrir le dossier</button>`; brancherDossier(); toast('Copie JPEG enregistrée'); return; }
      if(e.etat === 'erreur'){ if($('#r-etat-copie')) $('#r-etat-copie').textContent = 'Erreur : ' + e.message; return; }
    }
  };
  brancherDossier();
  if($('#r-effacer')) $('#r-effacer').onclick = async () => {
    await fetch(B+'/recup',{method:'POST',body:JSON.stringify({id, reglages:null})});
    delete RECUP[id]; ver[id] = (ver[id]||0)+1; toast('Retouches retirées'); fermerRecup();
  };
}
function brancherDossier(){ if($('#r-dossier')) $('#r-dossier').onclick = () => fetch(B+'/ouvrir_retouches',{method:'POST',body:'{}'}); }
async function sauverRetouche(id, copie){
  const corps = JSON.stringify({id, reglages:RR});
  if(copie) await fetch(B+'/copie',{method:'POST',body:corps}); else await fetch(B+'/recup',{method:'POST',body:corps});
  RECUP[id] = Object.assign({}, RR); ver[id] = (ver[id]||0)+1; RI.enregistres = RECUP[id];
  if(D[id]==='supprimer'){ await decider(id,'garder',true); compter(); toast('Photo remise en « à garder »'); }
}
function rendreRecup(){
  clearTimeout(rAttente);
  rAttente = setTimeout(async () => {
    const id = liste[idx], n = ++rNum;
    let url;
    if(rOriginal) url = `${B}/original/${encodeURIComponent(id)}.jpg${vq(id)}`;
    else url = `${B}/recup/${encodeURIComponent(id)}.jpg?` + new URLSearchParams({r: JSON.stringify(RR), zones: rZones?1:0, recadrer: modeRogner?0:1});
    $('#d-charge').hidden = false; $('#d-charge').textContent = 'Développement…';
    try{
      const rep = await fetch(url);
      if(!rep.ok){ const j = await rep.json().catch(()=>({})); toast('Erreur : ' + (j.erreur || rep.status)); return; }
      const blob = await rep.blob();
      if(!modeRecup || liste[idx]!==id || n!==rNum) return;
      if(rUrl) URL.revokeObjectURL(rUrl);
      rUrl = URL.createObjectURL(blob);
      img.onload = () => { img.onload = null; if(modeRogner) placerCadre(); };
      img.src = rUrl;
    } finally { if(n===rNum){ $('#d-charge').hidden = true; $('#d-charge').textContent = 'Chargement en pleine qualité…'; } }
  }, 110);
}
function fermerRecup(){ if(history.state && history.state.v==='recup') history.back(); else fermerRecupInterne(); }
function fermerRecupInterne(){
  modeRecup = false; modeRogner = false; cacherCadre(); $('#d-recup').classList.remove('on'); $('#d-badge').textContent='Retouche automatique';
  afficher();
}
$('#d-recup').onclick = () => modeRecup ? fermerRecup() : ouvrirRecup();

/* Rognage à la souris */
const cadre = $('#cadre');
function cacherCadre(){ cadre.hidden = true; }
function rectImage(){ const ri = img.getBoundingClientRect(), rs = scene.getBoundingClientRect(); return {x: ri.left - rs.left, y: ri.top - rs.top, w: ri.width, h: ri.height}; }
function demarrerRognage(){
  modeRogner = true; CROP = RR.crop ? {x:RR.crop[0], y:RR.crop[1], w:RR.crop[2], h:RR.crop[3]} : {x:0.05, y:0.05, w:0.9, h:0.9};
  RATIO = 0; panneauRecup(); rendreRecup(); cadre.hidden = false;
}
function validerRognage(){
  modeRogner = false; cacherCadre();
  RR.crop = (CROP.w > 0.995 && CROP.h > 0.995) ? null : [CROP.x, CROP.y, CROP.w, CROP.h].map(v => Math.round(v*100000)/100000);
  panneauRecup(); rendreRecup();
}
function appliquerRatio(v){
  RATIO = v; if(!v) return;
  const W = img.naturalWidth || 3, H = img.naturalHeight || 2;
  const r = v < 0 ? W / H : v;              // rapport largeur/hauteur voulu, en pixels
  const cx = CROP.x + CROP.w/2, cy = CROP.y + CROP.h/2;
  let w = 1, h = (W / H) / r;                // en coordonnées 0-1
  if(h > 1){ h = 1; w = r * H / W; }
  w *= 0.9; h *= 0.9;
  CROP = {w, h, x: Math.min(Math.max(cx - w/2, 0), 1 - w), y: Math.min(Math.max(cy - h/2, 0), 1 - h)};
}
function placerCadre(){
  if(!modeRogner) return;
  const r = rectImage();
  Object.assign(cadre.style, {left: r.x + CROP.x*r.w + 'px', top: r.y + CROP.y*r.h + 'px', width: CROP.w*r.w + 'px', height: CROP.h*r.h + 'px'});
  cadre.hidden = false;
}
let glisse = null;
cadre.addEventListener('pointerdown', e => {
  e.preventDefault(); cadre.setPointerCapture(e.pointerId);
  glisse = {type: e.target.dataset.p || 'deplacer', x0: e.clientX, y0: e.clientY, c: Object.assign({}, CROP), r: rectImage()};
});
cadre.addEventListener('pointermove', e => {
  if(!glisse) return;
  const g = glisse, dx = (e.clientX - g.x0) / g.r.w, dy = (e.clientY - g.y0) / g.r.h, c = Object.assign({}, g.c), MIN = 0.05;
  if(g.type === 'deplacer'){
    c.x = Math.min(Math.max(g.c.x + dx, 0), 1 - c.w); c.y = Math.min(Math.max(g.c.y + dy, 0), 1 - c.h);
  } else {
    let x0 = g.c.x, y0 = g.c.y, x1 = g.c.x + g.c.w, y1 = g.c.y + g.c.h;
    if(g.type.includes('w')) x0 = Math.min(Math.max(x0 + dx, 0), x1 - MIN);
    if(g.type.includes('e')) x1 = Math.max(Math.min(x1 + dx, 1), x0 + MIN);
    if(g.type.includes('n')) y0 = Math.min(Math.max(y0 + dy, 0), y1 - MIN);
    if(g.type.includes('s')) y1 = Math.max(Math.min(y1 + dy, 1), y0 + MIN);
    if(RATIO){
      const W = img.naturalWidth || 3, H = img.naturalHeight || 2, r = RATIO < 0 ? W/H : RATIO;
      let w = x1 - x0, h = w * W / (H * r);
      if(g.type.includes('n')) { y0 = y1 - h; if(y0 < 0){ y0 = 0; h = y1; w = h * H * r / W; } }
      else { y1 = y0 + h; if(y1 > 1){ y1 = 1; h = 1 - y0; w = h * H * r / W; } }
      if(g.type.includes('w')) x0 = x1 - w; else x1 = x0 + w;
    }
    c.x = x0; c.y = y0; c.w = x1 - x0; c.h = y1 - y0;
  }
  CROP = c; placerCadre();
});
cadre.addEventListener('pointerup', () => { glisse = null; });
window.addEventListener('resize', () => { if(modeRogner) placerCadre(); });

/* --- Photos similaires (doublons) --- */
function similaires(p){
  const ids = new Set(A.series[p.serie]);
  if(p.proche_de && PH[p.proche_de]) A.series[PH[p.proche_de].serie].forEach(i => ids.add(i));
  A.photos.forEach(q => { if(q.proche_de === p.id || (p.proche_de && q.proche_de === p.proche_de)) ids.add(q.id); });
  return [...ids].map(i => PH[i]).sort((a, b) => a.date - b.date);
}
function bandeSimilaires(p){
  const g = similaires(p);
  if(g.length < 2) return '';
  return `<div class="similaires"><div class="lig"><b>${g.length} photos similaires</b><span><kbd class="k">↑</kbd> <kbd class="k">↓</kbd> pour passer de l'une à l'autre</span></div>
    <div class="bande">${g.map(q => `<button class="vign d-${D[q.id]}${q.id===p.id?' actuelle':''}" data-aller="${esc(q.id)}" title="${esc(q.id)}">
      <img src="${B}/mini/${encodeURIComponent(q.id)}.jpg${vq(q.id)}" alt="">${q.meilleure_serie?'<span>★</span>':''}</button>`).join('')}</div></div>`;
}
function allerA(id){
  let j = liste.indexOf(id);
  if(j < 0){ liste.splice(idx + 1, 0, id); j = idx + 1; }
  idx = j; scene.classList.remove('zoom'); afficher();
  const v = document.querySelector('.vign.actuelle'); if(v) v.scrollIntoView({block:'nearest', inline:'center'});
}
function similaireVoisin(sens){
  const p = PH[liste[idx]], g = similaires(p);
  if(g.length < 2) return;
  const i = g.findIndex(q => q.id === p.id);
  allerA(g[(i + sens + g.length) % g.length].id);
}

/* --- Sélection multiple --- */
function majSel(){
  document.querySelectorAll('.photo').forEach(c => { const on = sel.has(c.dataset.id); c.classList.toggle('choisie', on); c.querySelector('.coche').textContent = on ? '✓' : ''; });
  $('#n-sel').textContent = `${sel.size} sélectionnée${sel.size>1?'s':''}`;
  $('#b-envoi').disabled = !sel.size;
}
function modeSelection(on){
  modeSel = on; document.body.classList.toggle('mode-sel', on);
  $('#b-sel').classList.toggle('on', on); $('#b-sel').textContent = on ? '☑ Sélection en cours' : '☐ Sélectionner';
  if(!on){ sel.clear(); dernierClic = null; }
  majSel();
}
$('#b-sel').onclick = () => modeSelection(!modeSel);
$('#b-sel-fin').onclick = () => modeSelection(false);
$('#b-sel-pivoter').onclick = async () => { for(const id of [...sel]) await pivoterId(id, 90); rendre(); majSel(); toast(`${sel.size} photo${sel.size>1?'s':''} pivotée${sel.size>1?'s':''}`); };
$('#b-sel-aucune').onclick = () => { sel.clear(); majSel(); };
document.querySelectorAll('[data-sel-dec]').forEach(b => b.onclick = async () => {
  if(!sel.size) return; await decider([...sel], b.dataset.selDec); rendre(); majSel();
});
let suiviEnvoi = null;
function fenetreEnvoi(etat){
  const n = sel.size, m = A._envoi;
  let h = `<h2>Envoyer sur Google Photos</h2>`;
  if(!etat || etat.etat==='repos' || etat.etat==='erreur'){
    h += `<p>${n} photo${n>1?'s':''} sélectionnée${n>1?'s':''}. L'appli prépare un dossier avec seulement ces photos, puis ouvre Google Photos dans ton navigateur : tu n'as plus qu'à y glisser les fichiers.</p>
      <div class="bloc-choix">
        ${[['originaux','Fichiers originaux (RAW + JPEG de l\'appareil)','Qualité maximale. Google Photos compte leur taille réelle dans ton espace.'],
           ['jpeg_appareil','JPEG de l\'appareil (ou RAW s\'il n\'y en a pas)','Plus léger.'],
           ['retouchees','JPEG retouchés','Avec la retouche auto, tes réglages « Récupérer » et la rotation. Un peu plus long.']]
          .map(([v,l,e])=>`<label style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ligne)"><input type="radio" name="mode-envoi" value="${v}" ${v===m?'checked':''}><span><b>${l}</b><br><span style="color:var(--doux);font-size:13px">${e}</span></span></label>`).join('')}
      </div>
      ${etat && etat.etat==='erreur' ? `<div class="bandeau r" style="margin-top:10px"><h3>Erreur</h3><p style="margin:0">${esc(etat.message)}</p></div>` : ''}
      <div class="actions"><button class="btn" id="en-fermer">Fermer</button><button class="btn bleu" id="en-go">Préparer l'envoi</button></div>`;
  } else if(etat.etat==='en cours'){
    const pc = etat.total ? Math.round(100*etat.fait/etat.total) : 0;
    h += `<div class="barre"><i style="width:${pc}%"></i></div><p>${esc(etat.message)} ${etat.fait}/${etat.total}</p>`;
  } else {
    h += `<div class="bandeau v"><h3>C'est prêt</h3><p style="margin:0;color:var(--txt)">${esc(etat.message)}</p></div>
      <ol style="color:var(--txt);padding-left:20px;line-height:1.6">
        <li>Le dossier s'est ouvert sur ton PC, et Google Photos dans ton navigateur.</li>
        <li>Sélectionne tous les fichiers du dossier (Ctrl+A) et glisse-les dans la page Google Photos.</li>
        <li>Pour les partager : dans Google Photos, ajoute-les à un album partagé avec ton pote.</li>
      </ol>
      <p style="font-size:13px;word-break:break-all">Dossier : ${esc(etat.dossier)}</p>
      <div class="actions"><button class="btn" id="en-fermer">Fermer</button><button class="btn" id="en-vider">Fermer et vider la sélection</button></div>`;
  }
  $('#f-envoi').innerHTML = h;
  if($('#en-fermer')) $('#en-fermer').onclick = () => $('#v-envoi').classList.remove('ouvert');
  if($('#en-vider')) $('#en-vider').onclick = () => { $('#v-envoi').classList.remove('ouvert'); sel.clear(); majSel(); };
  if($('#en-go')) $('#en-go').onclick = async () => {
    const mode = document.querySelector('[name=mode-envoi]:checked').value;
    const r = await fetch(B+'/preparer_envoi',{method:'POST',body:JSON.stringify({ids:[...sel], mode})});
    const j = await r.json(); if(!r.ok) return fenetreEnvoi({etat:'erreur', message:j.erreur});
    clearInterval(suiviEnvoi);
    suiviEnvoi = setInterval(async () => { const e = await (await fetch(B+'/envoi')).json(); fenetreEnvoi(e); if(e.etat!=='en cours') clearInterval(suiviEnvoi); }, 700);
    fenetreEnvoi(j);
  };
}
$('#b-envoi').onclick = () => { if(!sel.size) return; $('#v-envoi').classList.add('ouvert'); fenetreEnvoi(null); };

/* --- Export --- */
let suivi=null;
function fenetreExport(etat){
  const c={meilleure:0,garder:0,supprimer:0}; A.photos.forEach(p=>c[D[p.id]]++);
  const envoi={originaux:'les originaux tels quels',jpeg_appareil:"les JPEG de l'appareil quand ils existent",retouchees:'les versions retouchées'}[A._envoi];
  let corps = `<h2>Exporter la sortie</h2>
    <div class="ligne-export"><span>★ Meilleures : RAW original + JPEG retouché + formats</span><b>${c.meilleure}</b></div>
    <div class="ligne-export"><span>Dossier prêt pour Google Photos (meilleures + à garder)</span><b>${c.meilleure+c.garder}</b></div>
    <div class="ligne-export"><span>À supprimer (listées, non envoyées)</span><b>${c.supprimer}</b></div>
    <p>Le dossier pour Google Photos contiendra ${envoi} (modifiable dans les Réglages). Tu n'auras plus qu'à le glisser sur photos.google.com.</p>`;
  if(etat && etat.etat==='en cours'){
    const pc = etat.total ? Math.round(100*etat.fait/etat.total) : 0;
    corps += `<div class="barre"><i style="width:${pc}%"></i></div><p>${esc(etat.message)} ${etat.fait}/${etat.total}</p>`;
  } else if(etat && etat.etat==='termine'){
    corps += `<div class="bandeau v" style="margin-top:12px"><h3>Export terminé</h3><p style="margin:0;color:var(--txt)">${esc(etat.message)}</p></div>`;
  } else if(etat && etat.etat==='erreur'){
    corps += `<div class="bandeau r" style="margin-top:12px"><h3>Erreur</h3><p style="margin:0;color:var(--txt)">${esc(etat.message)}</p></div>`;
  }
  corps += `<div class="bandeau n" style="margin-top:14px"><h3>Libérer de la place</h3>
    <p style="margin:0 0 8px">Déplace les ${c.supprimer} photos « à supprimer » dans <b>_TRI/corbeille_a_verifier</b>. Rien n'est effacé : tu vérifies, puis tu supprimes ce dossier toi-même.</p>
    <div class="actions" style="justify-content:flex-start;margin:0"><button class="btn danger" id="e-ecart" ${c.supprimer?'':'disabled'}>Mettre de côté</button>
    ${A._deplacees?`<button class="btn" id="e-restaurer">Remettre les ${A._deplacees} fichiers à leur place</button>`:''}</div></div>
    <div class="actions">
      ${etat && etat.etat==='termine'?'<button class="btn" id="e-ouvrir">Ouvrir le dossier</button>':''}
      <button class="btn" id="e-fermer">Fermer</button>
      <button class="btn principal" id="e-go" ${etat && etat.etat==='en cours'?'disabled':''}>${etat && etat.etat==='termine'?'Exporter à nouveau':"Lancer l'export"}</button>
    </div>`;
  $('#f-export').innerHTML = corps;
  $('#e-fermer').onclick=()=>{$('#v-export').classList.remove('ouvert');};
  $('#e-go').onclick=async()=>{await fetch(B+'/exporter',{method:'POST'});suivre();};
  const o=$('#e-ouvrir'); if(o) o.onclick=()=>fetch(B+'/ouvrir_dossier',{method:'POST',body:JSON.stringify({quoi:'export'})});
  const ec=$('#e-ecart'); if(ec) ec.onclick=async()=>{
    if(!confirm(`Déplacer les fichiers des ${c.supprimer} photos « à supprimer » dans _TRI/corbeille_a_verifier ?`)) return;
    const r=await (await fetch(B+'/mettre_a_lecart',{method:'POST'})).json(); A._deplacees=(A._deplacees||0)+r.deplacees;
    toast(`${r.deplacees} fichiers mis de côté`); fenetreExport(etat); };
  const re=$('#e-restaurer'); if(re) re.onclick=async()=>{
    const r=await (await fetch(B+'/restaurer',{method:'POST'})).json(); A._deplacees=0; toast(`${r.restaurees} fichiers remis en place`); fenetreExport(etat); };
}
async function suivre(){
  clearInterval(suivi);
  const maj=async()=>{const e=await (await fetch(B+'/export')).json();fenetreExport(e);if(e.etat!=='en cours')clearInterval(suivi);};
  await maj(); suivi=setInterval(maj,1000);
}
$('#b-export').onclick=async()=>{$('#v-export').classList.add('ouvert');const e=await (await fetch(B+'/export')).json();fenetreExport(e);if(e.etat==='en cours')suivre();};

$('#b-plus').onclick=()=>$('#v-plus').classList.add('ouvert');
$('#a-fermer').onclick=()=>$('#v-plus').classList.remove('ouvert');
$('#a-doublons').onclick=async()=>{const ids=A.photos.filter(p=>p.suggestion==='doublon').map(p=>p.id);
  if(ids.length) await decider(ids,'supprimer'); $('#v-plus').classList.remove('ouvert'); rendre();};

  for(const s of ['meilleure','garder','supprimer']){const ids=A.photos.filter(p=>decisionParDefaut(p)===s).map(p=>p.id);if(ids.length)await decider(ids,s,true);}
  toast('Suggestions rétablies'); $('#v-plus').classList.remove('ouvert'); rendre();};
$('#a-dossier').onclick=()=>fetch(B+'/ouvrir_dossier',{method:'POST',body:'{}'});
document.querySelectorAll('.voile').forEach(v=>v.addEventListener('click',e=>{if(e.target===v)v.classList.remove('ouvert');}));

charger();
