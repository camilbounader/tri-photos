<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic · Tri Photos</title>
<link rel="icon" href="data:,">
<style>
:root{--fond:#0e1318;--fond2:#141b22;--ligne:#2a3642;--txt:#eef2f4;--doux:#9aa8b3;--vert:#3f9a6e;--titre:"Bahnschrift","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--txt);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:960px;margin:auto;padding:24px 16px 60px}
a{color:var(--doux)}
h1{margin:6px 0 4px;font-family:var(--titre);text-transform:uppercase;letter-spacing:.05em} p{color:var(--doux)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);margin:26px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--fond2);border:1px solid var(--ligne);border-radius:12px;overflow:hidden}
td{padding:7px 12px;border-bottom:1px solid var(--ligne);vertical-align:top;font-size:14px;word-break:break-all}
td:first-child{color:var(--doux);width:200px;word-break:normal}
pre{background:var(--fond2);border:1px solid var(--ligne);border-radius:12px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;margin:0}
button{font:inherit;cursor:pointer;background:var(--vert);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:600}
#ok{color:#7fd8a1;margin-left:10px}
</style>
</head>
<body>
<main>
  <a href="/">← Tri Photos</a>
  <h1>Diagnostic</h1>
  <p>Si quelque chose ne marche pas, clique sur « Copier le diagnostic » et colle-le dans ta conversation avec Claude.</p>
  <button id="copier">Copier le diagnostic</button><span id="ok"></span>
  <h2>Installation</h2><table id="infos"></table>
  <h2>Orientation (dernière sortie)</h2><pre id="orientation"></pre>
  <h2>Dernières erreurs</h2><pre id="erreurs"></pre>
  <h2>Installation de l'IA</h2><pre id="ia"></pre>
</main>
<script>
let texte = '';
(async () => {
  const d = await (await fetch('/api/diagnostic')).json();
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  document.getElementById('infos').innerHTML = Object.entries(d.infos).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  document.getElementById('erreurs').textContent = d.erreurs;
  document.getElementById('ia').textContent = d.installation_ia;
  const ori = (d.orientation || []).map(l => Object.entries(l).map(([k,v]) => `${k}=${v}`).join(' · ')).join('\n') || '(aucune sortie)';
  document.getElementById('orientation').textContent = ori;
  texte = 'DIAGNOSTIC TRI PHOTOS\n' + Object.entries(d.infos).map(([k,v]) => `${k} : ${v}`).join('\n') +
          '\n\n--- Orientation ---\n' + ori + '\n\n--- Dernières erreurs ---\n' + d.erreurs + '\n\n--- Installation de l\'IA ---\n' + d.installation_ia;
})();
document.getElementById('copier').onclick = async () => {
  try { await navigator.clipboard.writeText(texte); }
  catch(e) { const t = document.createElement('textarea'); t.value = texte; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  document.getElementById('ok').textContent = 'Copié ✓';
};
</script>
</body>
</html>
